<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Avalans | 笨猫</title>
    <link rel="icon" type="image/png" href="image/favicon.png">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent-1: #8B5CF6;
            --accent-2: #EC4899;
            --nav-height: 80px;
            --card-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
        }

        /* 增强型导航栏 */
        .nav-bar {
            position: fixed;
            top: 0;
            width: 100%;
            margin: 0,0,0,100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            backdrop-filter: blur(10px);
            background-color: var(--bg-secondary);
        }

        .nav-link-card{
            margin: 5%;
        }

        .brand {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1.5px;
            transition: opacity 0.3s;
        }

            .brand:hover {
                opacity: 0.9;
            }

        /* 优化导航链接 */
        .flexbox {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        /* 链接基础样式 */
        .flexbox a {
            color: #888;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        /* 悬停效果 */
        .flexbox a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 激活状态指示器 */
        .flexbox a.nuxt-link-exact-active {
            color: #fff;
            font-weight: 500;
        }

        .flexbox a.nuxt-link-exact-active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #8B5CF6, #EC4899);
        }

        /* 响应式容器 */
        .container {
            padding-top: calc(var(--nav-height) + 50px);
            max-width: min(90%, 1200px);
            margin: 0 auto;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        /* 增强身份标识 */
        .identity {
            margin-bottom: 4rem;
        }

        .title {
            font-size: clamp(2rem, 8vw, 3rem);
            margin-bottom: 1.2rem;
            font-family: 'Courier New', monospace;
            line-height: 1.2;
            background: linear-gradient(45deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: clamp(1rem, 3vw, 1.2rem);
            letter-spacing: 0.5px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 现代化卡片设计 */
        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 0 1rem;
        }

        .link-card {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: var(--card-radius);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-5px);
        }

        .link-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #8B5CF6;
        }

        .link-desc {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 增强响应式设计 */
        @media (max-width: 768px) {
            .nav-bar {
                padding: 0 1rem;
            }

            .flexbox a {
                padding: 6px 10px;
            }

            .links {
                grid-template-columns: 1fr;
            }

            .link-card {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .flexbox {
                gap: 10px;
            }

            .subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="brand">Stupid Cat</div>
            <div class="flexbox">
                <a href="/" aria-current="page">Main / 主页</a>
                <a class="nuxt-link-exact-active nuxt-link-active">Links / 链接</a>
            </div>
    </nav>
    <div class="container">
        <div class="identity">
            <h1 class="title">了解傻喵</h1>
            <p class="subtitle">Code | Game | Indoorsy | ACGN / 代码 | 游戏 | 宅 | 二次元</p>
        </div>
    </div>
    
    <nav class="nav-link-card">
        <div class="links">
            <div class="link-card">
                <h3 class="link-title">Code</h3>
                <p class="link-desc">Web Development & Open Source Projects</p>
            </div>
            <div class="link-card">
                <h3 class="link-title">Art</h3>
                <p class="link-desc">Digital Art & Creative Design</p>
            </div>
            <div class="link-card">
                <h3 class="link-title">Music</h3>
                <p class="link-desc">Electronic Music Production</p>
            </div>
        </div>
    </nav>
</body>
</html>
